name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,workers,dashboard,sdk]"
          pip install -e sdk/
      - name: Run lint (ruff)
        run: ruff check .
      - name: Run format check (ruff)
        run: ruff format --check .
      - name: Run type check (mypy)
        run: mypy api/ core/ workers/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_obs
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,workers,dashboard,sdk]"
          pip install -e sdk/
      - name: Run tests
        env:
          AGENT_OBS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agent_obs
          AGENT_OBS_DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/agent_obs
          AGENT_OBS_REDIS_URL: redis://localhost:6379/0
          AGENT_OBS_SECRET_KEY: test-key
        run: |
          pytest tests/ -v --cov=api --cov=core --cov=workers --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[dev,workers,dashboard,sdk]"
          pip install -e sdk/
          pip install pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scanner
        run: bandit -r api/ core/ workers/ -c pyproject.toml -f sarif -o bandit-results.sarif || true
      - name: Check dependencies for vulnerabilities
        run: pip install pip-audit && pip-audit
        continue-on-error: true

  precheck:
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, precommit, security]
    steps:
      - name: Gate check
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Precommit: ${{ needs.precommit.result }}"
          echo "Security: ${{ needs.security.result }}"
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ] || \
             [ "${{ needs.precommit.result }}" = "failure" ]; then
            echo "❌ Pre-CI gate failed"
            exit 1
          fi
          echo "✅ Pre-CI gate passed"

  docker-build:
    runs-on: ubuntu-latest
    needs: [precheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v4
        with:
          files: docker-compose.yml
          push: true
          set: |
            *.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: [trivy-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/agent-observability
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
