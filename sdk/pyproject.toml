[project]
name = "agent-obs-sdk"
version = "0.1.0"
description = "Python SDK for Agent Observability Dashboard — push traces from any LangGraph agent"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
]
keywords = ["llm", "observability", "langgraph", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/your-org/agent-observability"
Documentation = "https://agent-obs.dev/docs"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
